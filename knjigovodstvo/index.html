<!DOCTYPE html>
<html lang="sr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Књиговодство Тренер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.ctn{max-width:960px;margin:0 auto;padding:10px 8px}
h1{font-size:22px;font-weight:900;text-align:center;padding:18px 0 4px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:16px}
.card{background:#1e293b;border:1px solid #475569;border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.card:hover{border-color:#3b82f6;box-shadow:0 4px 12px rgba(59,130,246,.2)}
.card h3{font-size:14px;font-weight:700}
.card p{font-size:10px;color:#94a3b8;margin-top:2px}
.ltog{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:12px;border:1px solid #475569;background:#1e293b}
.ltog.on{border-color:#60a5fa;background:rgba(59,130,246,.1)}
.top{background:#1e293b;border-bottom:1px solid #475569;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.top button{background:none;border:none;color:#3b82f6;cursor:pointer;font-size:12px;font-weight:600}
.tt{background:#1e293b;border-radius:10px;border:1px solid #475569;margin-bottom:8px;overflow:hidden}
.tth{padding:8px 12px;background:#334155;cursor:pointer;display:flex;justify-content:space-between;font-weight:700;font-size:12px}
.ttl{padding:5px 12px;font-size:11px;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.5}
.ttl:nth-child(odd){background:rgba(255,255,255,.02)}
.tabs{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto}
.tb{padding:7px 12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:10px;font-weight:600;white-space:nowrap}
.tb.on{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#93c5fd}
.tw{background:#1e293b;border-radius:10px;border:1px solid #475569;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:680px}
thead th{padding:6px 5px;font-size:9px;font-weight:700;text-align:center;color:#94a3b8;background:#334155}
tbody td{padding:3px 2px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.ci{width:100%;min-width:44px;padding:4px 3px;border:2px solid #fbbf24;border-radius:4px;font-size:10px;font-weight:700;text-align:right;outline:none;background:#fffde7;color:#78350f;font-family:inherit;box-sizing:border-box}
.ci.ok{border-color:#16a34a;background:#bbf7d0;color:#14532d;box-shadow:0 0 0 1px #16a34a}
.ci.bad{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.hb{cursor:pointer;font-size:11px;opacity:.7;user-select:none;flex-shrink:0;margin-left:3px;color:#fbbf24;filter:drop-shadow(0 0 3px rgba(251,191,36,.4));transition:all .15s;display:inline-flex;align-items:center}
.hb:hover{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
/* Mobile: help button below each cell */
.hb-mob{display:none;width:100%;padding:4px 0;margin-top:3px;border:none;border-radius:4px;background:rgba(251,191,36,.1);color:#fbbf24;font-size:10px;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.hb-mob:active{background:rgba(251,191,36,.2)}
@media(max-width:700px){
  .hb{display:none!important}
  .hb-mob{display:block}
}
.tip{position:absolute;left:-8px;top:100%;z-index:30;background:#0f172a;color:#e2e8f0;padding:10px 12px;border-radius:10px;font-size:10px;line-height:1.6;width:280px;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid #475569}
.tip b{color:#60a5fa}
.tip .cl{margin-top:5px;color:#94a3b8;font-size:9px;cursor:pointer}
.tr td{padding:5px;background:rgba(34,197,94,.1);font-weight:700;color:#22c55e;font-size:10px}
.cr td{padding:4px 5px;font-size:10px;font-weight:700}
.crok{background:rgba(34,197,94,.1);color:#22c55e}
.crbd{background:rgba(239,68,68,.1);color:#ef4444}
.sumr td{padding:4px 2px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(99,102,241,.08)}
.chkr td{padding:4px 2px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(251,191,36,.06)}
.ansr td{padding:5px;background:rgba(34,197,94,.1);font-weight:700;color:#22c55e;font-size:10px}
.btn1{padding:9px 18px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:white;cursor:pointer;font-size:12px;font-weight:700}
.btn2{padding:9px 14px;border-radius:8px;background:#1e293b;border:1px solid #475569;color:#94a3b8;cursor:pointer;font-size:11px}
.res{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:600}
.rok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.rpt{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fcd34d}
.inf{padding:8px 12px;margin-bottom:8px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);border-radius:8px;font-size:10px;color:#93c5fd;line-height:1.6}
.pjr{display:flex;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.05);gap:10px;font-size:10px}
.pjr:nth-child(odd){background:rgba(255,255,255,.02)}
.pjt{font-weight:700;color:#60a5fa;min-width:120px;flex-shrink:0}
.pjd{color:#cbd5e1}

/* ===== NASLOVNA STRANA ===== */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap');
.nsl{min-height:100vh;background:#06080f;font-family:'Outfit',sans-serif}
/* Sticky mini header */
.minibar{position:sticky;top:0;z-index:30;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,8,15,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.04)}
.minibar .logo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px}
.minibar .logo span{font-size:16px}
.minibar .xpchip{font-size:11px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.15);padding:3px 10px;border-radius:12px}
/* HERO — split layout */
.hero{position:relative;padding:32px 20px 28px;overflow:hidden;
  background:linear-gradient(160deg,#080c18 0%,#10152e 35%,#1a1045 65%,#0d1020 100%)}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(to top,#06080f,transparent);pointer-events:none;z-index:1}
.hero-inner{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:20px;position:relative;z-index:2}
@media(max-width:500px){.hero-inner{flex-direction:column;text-align:center}}
.hero-text{flex:1;min-width:0}
.hero-text h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:8px;letter-spacing:-.3px}
.hero-text h1 em{font-style:normal;background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-text p{color:#8892a8;font-size:13px;line-height:1.5;margin-bottom:14px}
.hero-text p b{color:#c8d6e5;font-weight:600}
.cta-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:#0f172a;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 4px 20px rgba(251,191,36,.3);transition:all .2s}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(251,191,36,.4)}
.cta-btn:active{transform:scale(.97)}
.hero-vis{flex-shrink:0;width:160px;height:160px;position:relative}
@media(max-width:500px){.hero-vis{width:130px;height:130px}}
.hero-vis svg{width:100%;height:100%;filter:drop-shadow(0 8px 30px rgba(99,102,241,.2))}
/* XP bar under hero */
.xpstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.04)}
.xpstrip .xs{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#64748b}
.xpstrip .xs b{color:#e2e8f0}
.xpstrip .xs .gold{color:#fbbf24}
.xpstrip .xs .grn{color:#4ade80}
/* Section label */
.sec-label{padding:16px 16px 8px;max-width:540px;margin:0 auto}
.sec-label h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:2px}
.sec-label p{font-size:11px;color:#475569}
/* GRID */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px;max-width:540px;margin:0 auto}
.tgrid .tc2:nth-child(5){grid-column:1 / -1;max-width:260px;justify-self:center}
@media(max-width:480px){.tgrid{grid-template-columns:1fr;max-width:300px}.tgrid .tc2:nth-child(5){max-width:none}}
/* Card */
.tc2{position:relative;border-radius:14px;padding:14px 16px;cursor:pointer;overflow:hidden;
  transition:all .25s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:4px}
.tc2:hover{transform:translateY(-3px) scale(1.01);z-index:2}
.tc2:active{transform:scale(.97)}
.tc2.c0{background:linear-gradient(145deg,#12103a,#1e1b4b);border-color:rgba(99,102,241,.2)}
.tc2.c0:hover{box-shadow:0 10px 35px rgba(99,102,241,.2)}
.tc2.c1{background:linear-gradient(145deg,#18150a,#292218);border-color:rgba(180,160,100,.12)}
.tc2.c1:hover{box-shadow:0 10px 35px rgba(180,160,100,.12)}
.tc2.c2{background:linear-gradient(145deg,#081a0e,#0f3520);border-color:rgba(34,197,94,.15)}
.tc2.c2:hover{box-shadow:0 10px 35px rgba(34,197,94,.12)}
.tc2.c3{background:linear-gradient(145deg,#160a28,#2e0a50);border-color:rgba(168,85,247,.15)}
.tc2.c3:hover{box-shadow:0 10px 35px rgba(168,85,247,.12)}
.tc2.c4{background:linear-gradient(145deg,#1a0f05,#351505);border-color:rgba(249,115,22,.15)}
.tc2.c4:hover{box-shadow:0 10px 35px rgba(249,115,22,.12)}
.tc2.locked{opacity:.3;cursor:default;filter:saturate(.2) brightness(.6)}
.tc2.locked:hover{transform:none;box-shadow:none}
.tc2 .tchead{display:flex;align-items:center;gap:8px}
.tc2 .tcico{font-size:22px;line-height:1}
.tc2 .tcnm{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#fff;line-height:1.2}
.tc2 .tcsub{font-size:9px;color:#64748b;line-height:1.35}
.tc2 .tcbot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;padding-top:4px}
.tc2 .tcpill{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:700}
.tc2 .tcpill.rdy{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.15)}
.tc2 .tcpill.soon{background:rgba(255,255,255,.03);color:#334155;border:1px solid rgba(255,255,255,.05)}
.tc2 .tcsal{font-size:10px;font-weight:800;color:#fbbf24;white-space:nowrap}
.tc2 .tcpbar{height:3px;width:100%;background:rgba(255,255,255,.05);border-radius:2px;margin-top:4px}
.tc2 .tcpfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#6366f1,#a78bfa);transition:width .8s}
/* Anims */
@keyframes tcPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.tc2{animation:tcPop .35s cubic-bezier(.22,1,.36,1) backwards}
.tc2:nth-child(1){animation-delay:.05s}.tc2:nth-child(2){animation-delay:.1s}
.tc2:nth-child(3){animation-delay:.15s}.tc2:nth-child(4){animation-delay:.2s}
.tc2:nth-child(5){animation-delay:.25s}
/* Footer */
.nfoot{text-align:center;padding:8px 16px 28px;font-size:9px;color:#1e293b;letter-spacing:.5px}

/* Difficulty badges */
.difbadge{display:inline-block;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px;vertical-align:middle}
.difbadge.easy{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.15)}
.difbadge.med{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.15)}
.difbadge.hard{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.15)}
/* Wallet on hero */
.wallet-box{padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(245,158,11,.06));border:1px solid rgba(251,191,36,.18);margin:12px auto 0;max-width:260px;text-align:center}
.wallet-box .wb-amt{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.wallet-box .wb-label{font-size:10px;color:#94a3b8;margin-top:2px}
.wallet-box .wb-sub{font-size:9px;color:#64748b;margin-top:4px}
/* Test mode indicator */
.mode-ind{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px}
.mode-ind.learn{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.15)}
.mode-ind.test{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.15)}
/* Salary card highlight */
.tc2 .tcsal-box{margin-top:6px;padding:6px 10px;border-radius:8px;background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.06));border:1px solid rgba(251,191,36,.18)}
.tc2 .tcsal-box .sal-label{font-size:8px;color:#94a3b8;display:block;margin-bottom:1px}
.tc2 .tcsal-box .sal-amt{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fbbf24;line-height:1}
.tc2 .tcsal-box .sal-unit{font-size:9px;color:#64748b;font-weight:400}

/* Earnings compact collapsible */
.earn-wrap{max-width:540px;margin:0 auto;padding:0 12px}
.earn-mini{background:linear-gradient(135deg,#1a1505,#13110a);border:1px solid rgba(251,191,36,.15);border-radius:12px;overflow:hidden}
.earn-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.earn-head .eh-left{display:flex;align-items:center;gap:8px}
.earn-head .eh-amt{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.earn-head .eh-of{font-size:10px;color:#64748b}
.earn-head .eh-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:0 10px;min-width:40px;max-width:100px}
.earn-head .eh-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width .6s}
.earn-head .eh-arrow{font-size:10px;color:#64748b;transition:transform .2s}
.earn-head .eh-arrow.open{transform:rotate(180deg)}
.earn-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.earn-body.open{max-height:500px}
.earn-body .eb-inner{padding:0 12px 10px;display:flex;flex-direction:column;gap:4px}
.earn-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:10px}
.earn-row:nth-child(odd){background:rgba(255,255,255,.015)}
.earn-row .er-st{width:14px;text-align:center;font-size:11px;flex-shrink:0}
.earn-row .er-name{color:#94a3b8;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.earn-row.done .er-name{color:#cbd5e1}
.earn-row .er-km{font-weight:800;font-size:10px;flex-shrink:0}
.earn-row .er-km.done{color:#4ade80}
.earn-row .er-km.pending{color:#fbbf24}

/* Error analysis panel */
.errpanel{margin-top:10px;border-radius:10px;border:1px solid rgba(239,68,68,.15);background:rgba(239,68,68,.04);padding:10px 12px;font-size:10px}
.errpanel .eptitle{font-weight:700;color:#f87171;margin-bottom:8px;font-size:11px}
.errpanel .eritem{padding:6px 8px;margin-bottom:4px;border-radius:6px;background:rgba(0,0,0,.2);border-left:3px solid #ef4444;line-height:1.5}
.errpanel .eritem .erloc{color:#f87171;font-weight:700;margin-bottom:2px}
.errpanel .eritem .erwrong{color:#fca5a5}
.errpanel .eritem .erright{color:#86efac}
.errpanel .eritem .erexp{color:#94a3b8;margin-top:3px;font-size:9px;line-height:1.5}
.errpanel .erok{padding:8px;text-align:center;color:#4ade80;font-weight:700}
/* Edu cards on menu page */
.educards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:480px){.educards{grid-template-columns:1fr}}
.educard{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .2s}
.educard:hover{border-color:#6366f1}
.educard .edutop{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.educard .edutop span{font-size:16px}
.educard .edutop b{font-size:11px;color:#fff}
.educard .edubody{font-size:9px;color:#94a3b8;line-height:1.5;max-height:0;overflow:hidden;transition:max-height .3s}
.educard.open .edubody{max-height:300px}
.educard .edubody p{margin-bottom:4px}
.educard .edubody .formula{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.12);border-radius:4px;padding:4px 8px;margin:3px 0;font-weight:700;color:#a5b4fc;font-size:10px}

.hero-plus{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}
.hero-plus .hp-line{height:1px;width:30px;background:linear-gradient(90deg,transparent,rgba(251,191,36,.3),transparent)}
.hero-plus .hp-sign{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#fbbf24;line-height:1;text-shadow:0 0 20px rgba(251,191,36,.3)}


.onb-try{margin-top:12px;padding:12px;border-radius:10px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.12)}
.onb-try .try-q{font-size:11px;color:#e2e8f0;font-weight:600;margin-bottom:6px}
.onb-try input{width:80px;padding:5px 8px;border-radius:6px;border:2px solid #fbbf24;background:#1a1800;color:#fbbf24;font-size:12px;font-weight:700;text-align:center;outline:none;font-family:inherit}
.onb-try input.correct{border-color:#22c55e;background:#001a0d;color:#22c55e}
.onb-try .try-fb{font-size:10px;margin-top:4px;font-weight:600}

/* ===== RESPONSIVE ===== */
.desk-only{display:block}
.mob-only{display:none}
@media(max-width:700px){
  
  .mob-only{display:none!important}
  .ctn{padding:6px 4px}
  h1{font-size:18px}
  h2{font-size:14px!important}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
}
/* Mobile card view */
.mob-cards{display:flex;flex-direction:column;gap:8px;padding:4px}
.mob-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 12px;position:relative}
.mob-card .mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06)}
.mob-card .mc-date{font-size:9px;color:#64748b;font-weight:600}
.mob-card .mc-name{font-size:11px;color:#e2e8f0;font-weight:700}
.mob-card .mc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.mob-card .mc-field{display:flex;flex-direction:column;gap:2px}
.mob-card .mc-label{font-size:8px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.mob-card .mc-val{position:relative}
.mob-card .mc-val .ci{font-size:12px;padding:6px 8px;min-width:auto;width:100%;text-align:center}
.mob-card .mc-val .hb{position:absolute;right:-2px;top:-2px}
/* Mobile summary cards */
.mob-summary{background:#1e293b;border:1px solid #475569;border-radius:10px;padding:10px 12px;margin-top:4px}
.mob-summary .ms-title{font-size:10px;font-weight:700;margin-bottom:6px}
.mob-summary .ms-title.sum{color:#818cf8}
.mob-summary .ms-title.chk{color:#fbbf24}
.mob-summary .ms-title.ans{color:#22c55e}
.mob-summary .ms-title.dp{color:#60a5fa}
.mob-summary .ms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:4px}
.mob-summary .ms-item{text-align:center}
.mob-summary .ms-item .ms-lbl{font-size:7px;color:#64748b;text-transform:uppercase}
.mob-summary .ms-item .ms-val{font-size:11px;font-weight:700}
.mob-summary .ms-item .ci{font-size:11px;padding:4px;width:100%;text-align:center}

/* Sticky task text on mobile */
@media(max-width:700px){
  .tt{position:sticky;top:37px;z-index:15;margin-bottom:4px;border-radius:0;border-left:none;border-right:none;max-height:45vh;overflow-y:auto}
  .tth{padding:6px 10px;font-size:11px}
  .ttl{padding:3px 10px;font-size:10px}
  .top{padding:4px 10px}
  .top button{font-size:11px}
  .tabs{margin-bottom:4px}
  .tb{padding:5px 10px;font-size:9px}
  .btn1{padding:7px 14px;font-size:11px}
  .btn2{padding:7px 10px;font-size:10px}
}

/* Confetti & success celebration */
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes successPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes coinSpin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.confetti-wrap{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;border-radius:2px;animation:confettiFall linear forwards}
.success-overlay{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);animation:successPop .4s cubic-bezier(.34,1.56,.64,1)}
.success-box{text-align:center;padding:30px 24px;max-width:300px;border-radius:20px;background:linear-gradient(145deg,#1a1505,#1c1708);border:2px solid rgba(251,191,36,.3);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(251,191,36,.1)}
.success-box .sb-coin{font-size:50px;display:inline-block;animation:coinSpin 1s ease-in-out}
.success-box .sb-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:10px 0 4px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 2s linear infinite}
.success-box .sb-km{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:#fbbf24;margin:6px 0;text-shadow:0 0 20px rgba(251,191,36,.4)}
.success-box .sb-sub{font-size:11px;color:#94a3b8;margin-bottom:14px}
.success-box .sb-rank{font-size:13px;color:#e2e8f0;margin-bottom:14px}
.success-box .sb-btn{padding:10px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f172a;font-size:13px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif}
.success-box .sb-btn:active{transform:scale(.95)}

/* Mobile table optimization */
@media(max-width:700px){
  table{min-width:520px;font-size:9px}
  thead th{padding:4px 2px;font-size:7px}
  tbody td{padding:2px 1px;font-size:9px}
  .ci{min-width:36px;padding:3px 2px;font-size:9px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tr td{font-size:9px;padding:3px}
  .cr td{font-size:9px;padding:3px}
  .sumr td{font-size:9px}
  .ansr td{font-size:9px}
  .hb{font-size:9px}
  .tip{width:220px;font-size:9px}
  .hb-mob{font-size:9px;padding:3px 0}
}

function sSynDob(a,b){var r=[],sl=0,ai=0,bi=0;
while(ai<a.length-1||bi<b.length-1){
var ae=ai<a.length-1?a[ai]:null,be=bi<b.length-1?b[bi]:null;
var dg=0,pt=0,nm="",dt="",srcAd=0,srcBd=0,srcAp=0,srcBp=0;
if(ae&&be&&ae.d===be.d){
 srcAd=ae.dg||0;srcBd=be.dg||0;srcAp=ae.pt||0;srcBp=be.pt||0;
 dg=srcAd+srcBd;pt=srcAp+srcBp;
 nm=ae.n+(be.n!==ae.n?" + "+be.n:"");dt=ae.d;ai++;bi++;
}
else if(ae&&(!be||ae.d<be.d)){srcAd=ae.dg||0;srcAp=ae.pt||0;dg=srcAd;pt=srcAp;nm=ae.n;dt=ae.d;ai++;}
else{srcBd=be.dg||0;srcBp=be.pt||0;dg=srcBd;pt=srcBp;nm=be.n;dt=be.d;bi++;}
var psl=sl;sl=sl+pt-dg;
var exDD=null,exPP=null;
if(dg){
 var dgParts=[];if(srcAd)dgParts.push("МИН "+fmt(srcAd));if(srcBd)dgParts.push("Слобода "+fmt(srcBd));
 exDD="СИНТЕТИЧКИ ДУГУЈЕ = збир свих аналитичких Дугује за овај датум.<br><br>"+dgParts.join(" + ")+" = <b>"+fmt(dg)+"</b><br><br>✏ УПИСАТИ: <b>"+fmt(dg)+"</b>";
}
if(pt){
 var ptParts=[];if(srcAp)ptParts.push("МИН "+fmt(srcAp));if(srcBp)ptParts.push("Слобода "+fmt(srcBp));
 exPP="СИНТЕТИЧКИ ПОТРАЖУЈЕ = збир свих аналитичких Потражује за овај датум.<br><br>"+ptParts.join(" + ")+" = <b>"+fmt(pt)+"</b><br><br>✏ УПИСАТИ: <b>"+fmt(pt)+"</b>";
}
var exSS="САЛДО = "+fmt(psl)+(pt?" + "+fmt(pt):"")+(dg?" − "+fmt(dg):"")+" = <b>"+fmt(sl)+"</b>.<br><br>Ово је укупна обавеза према СВИМ добављачима скупа.<br><br>✏ УПИСАТИ: <b>"+fmt(sl)+"</b>";
r.push({d:dt,n:nm,dg:dg||null,pt:pt||null,sl:sl,ex:{dg:exDD,pt:exPP,sl:exSS}});}
var slLastS=sl;
r.push({d:"",n:"Салдо за изравнање",dg:slLastS>0?slLastS:null,pt:slLastS<0?Math.abs(slLastS):null,sl:0,ex:{
dg:slLastS>0?"САЛДО ЗА ИЗРАВНАЊЕ — преостала скупна обавеза ("+fmt(slLastS)+" КМ) преноси се на ДУГОВНУ да се конто затвори.<br><br>✏ УПИСАТИ: <b>"+fmt(slLastS)+"</b>":null,
pt:slLastS<0?"САЛДО ЗА ИЗРАВНАЊЕ на ПОТРАЖНОЈ страни.<br><br>✏ УПИСАТИ: <b>"+fmt(Math.abs(slLastS))+"</b>":null,
sl:"<b>0</b> — синтетички конто је затворен. Салдо од "+fmt(Math.abs(slLastS))+" КМ МОРА бити једнак збиру салда из извода!<br><br>✏ УПИСАТИ: <b>0</b>"
}});
return r;}

// Генерализовани синтетички за N добављача (списак dataArrays и lblsArray)
function sSynDobN(arrs,lbls){
 var r=[],sl=0;
 // idx[i] = тренутни индекс у arrs[i] (без задњег "Салдо за изравнање")
 var idx=arrs.map(function(){return 0;});
 var lens=arrs.map(function(a){return a.length-1;}); // -1 да изоставимо салдо за изравнање
 while(idx.some(function(i,n){return i<lens[n];})){
  // Нађи најмањи датум међу свим неискоришћеним догађајима
  var minDate=null;
  for(var n=0;n<arrs.length;n++){
   if(idx[n]<lens[n]){
    var d2=arrs[n][idx[n]].d;
    if(minDate===null||d2<minDate)minDate=d2;
   }
  }
  if(minDate===null)break;
  // Покупи СВЕ догађаје са тим датумом
  var dg=0,pt=0,nms=[],dgParts=[],ptParts=[];
  for(var n2=0;n2<arrs.length;n2++){
   if(idx[n2]<lens[n2]&&arrs[n2][idx[n2]].d===minDate){
    var ev=arrs[n2][idx[n2]];
    var srcD=ev.dg||0,srcP=ev.pt||0;
    dg+=srcD;pt+=srcP;
    if(srcD)dgParts.push(lbls[n2]+" "+fmt(srcD));
    if(srcP)ptParts.push(lbls[n2]+" "+fmt(srcP));
    if(nms.indexOf(ev.n)===-1)nms.push(ev.n);
    idx[n2]++;
   }
  }
  var psl=sl;sl=sl+pt-dg;
  var exDD=dg?"СИНТЕТИЧКИ ДУГУЈЕ = збир свих аналитичких Дугује за овај датум.<br><br>"+dgParts.join(" + ")+" = <b>"+fmt(dg)+"</b><br><br>✏ УПИСАТИ: <b>"+fmt(dg)+"</b>":null;
  var exPP=pt?"СИНТЕТИЧКИ ПОТРАЖУЈЕ = збир свих аналитичких Потражује за овај датум.<br><br>"+ptParts.join(" + ")+" = <b>"+fmt(pt)+"</b><br><br>✏ УПИСАТИ: <b>"+fmt(pt)+"</b>":null;
  var exSS="САЛДО = "+fmt(psl)+(pt?" + "+fmt(pt):"")+(dg?" − "+fmt(dg):"")+" = <b>"+fmt(sl)+"</b>.<br><br>Ово је укупна обавеза према СВИМ добављачима скупа.<br><br>✏ УПИСАТИ: <b>"+fmt(sl)+"</b>";
  r.push({d:minDate,n:nms.join(" + "),dg:dg||null,pt:pt||null,sl:sl,ex:{dg:exDD,pt:exPP,sl:exSS}});
 }
 var slLastN=sl;
 r.push({d:"",n:"Салдо за изравнање",dg:slLastN>0?slLastN:null,pt:slLastN<0?Math.abs(slLastN):null,sl:0,ex:{
  dg:slLastN>0?"САЛДО ЗА ИЗРАВНАЊЕ — преостала скупна обавеза ("+fmt(slLastN)+" КМ) преноси се на ДУГОВНУ да се конто затвори.<br><br>✏ УПИСАТИ: <b>"+fmt(slLastN)+"</b>":null,
  pt:slLastN<0?"САЛДО ЗА ИЗРАВНАЊЕ на ПОТРАЖНОЈ страни.<br><br>✏ УПИСАТИ: <b>"+fmt(Math.abs(slLastN))+"</b>":null,
  sl:"<b>0</b> — синтетички конто је затворен. Салдо од "+fmt(Math.abs(slLastN))+" КМ МОРА бити једнак збиру салда из извода!<br><br>✏ УПИСАТИ: <b>0</b>"
 }});
 return r;
}

function startTask(t){S.task=t;S.inp={};S.chk={};S.expK=null;S.showTT=true;S.view="work";S.skipRead=true;var d={};
if(t.id===1){d.fifo=sFifo(t.ev);d.avg=sAvg(t.ev);d.plan=sPlan(t.ev,42);S.tab="fifo";}
else if(t.id===2){d.stof=sPlan(t.stof.ev,100);d.svila=sPlan(t.svila.ev,50);d.stof.lbA="Штоф";d.stof.lbB="Свила";d.syn=sSyn(d.stof,d.svila);S.tab="stof";}
else if(t.id===3){d.fifo=sFifo(t.ev);S.tab="fifo";}
else if(t.id===4){d.avg=sAvg(t.ev);S.tab="avg";}
else if(t.id===5){d.pamuk=sPlan(t.pamuk.ev,9);d.vuna=sPlan(t.vuna.ev,10);d.pamuk.lbA="Памук";d.pamuk.lbB="Вуна";d.syn=sSyn(d.pamuk,d.vuna);S.tab="pamuk";}
else if(t.id===6){
var cEv=t.cigle.ev.slice();var crEv=t.crijep.ev.slice();
var cKnj=0;for(var i=0;i<cEv.length;i++){var e=cEv[i];if(e.t==="ps"||e.t==="nab")cKnj+=e.q;else if(e.t==="tr")cKnj-=e.q;else if(e.t==="pv")cKnj+=e.q;}
var crKnj=0;for(var i=0;i<crEv.length;i++){var e=crEv[i];if(e.t==="ps"||e.t==="nab")crKnj+=e.q;else if(e.t==="tr")crKnj-=e.q;else if(e.t==="pv")crKnj+=e.q;}
var cStvarno=t.inv.cigle,crStvarno=t.inv.crijep;
var cDiff=cStvarno-cKnj,crDiff=crStvarno-crKnj;
if(cDiff<0)cEv.push({d:"31.08.",n:"Мањак (инвентура)",t:"manjak",q:Math.abs(cDiff)});
else if(cDiff>0)cEv.push({d:"31.08.",n:"Вишак (инвентура)",t:"visak",q:cDiff});
if(crDiff<0)crEv.push({d:"31.08.",n:"Мањак (инвентура)",t:"manjak",q:Math.abs(crDiff)});
else if(crDiff>0)crEv.push({d:"31.08.",n:"Вишак (инвентура)",t:"visak",q:crDiff});
d.cigle=sPlan(cEv,6);d.crijep=sPlan(crEv,10);
d.cigle.lbA="Цигле";d.cigle.lbB="Цријеп";
d.syn=sSyn(d.cigle,d.crijep);S.tab="cigle";}
else if(t.id===7){d.plan=sPlan(t.ev,20);S.tab="plan";}
else if(t.id===8){d.avg=sAvg(t.ev);S.tab="avg";}
else if(t.id===9){d.fifo=sFifo(t.ev);S.tab="fifo";}
else if(t.id===10){d.drvo=sPlan(t.drvo.ev,30);d.lijepak=sPlan(t.lijepak.ev,5);d.drvo.lbA="Дрво";d.drvo.lbB="Лијепак";d.syn=sSyn(d.drvo,d.lijepak);S.tab="drvo";}
else if(t.id===101){d.min=sDob(t.min_ev);d.slob=sDob(t.slob_ev);d.syn=sSynDob(d.min,d.slob);S.tab="min";}
else if(t.id===102){d.boja=sPlan(t.boja_ev,120);d.duga=sDob(t.duga_ev);d.ziro=sZiro(t.ziro_ev);S.tab="boja";}
else if(t.id===103){d.dukat=sDob(t.dukat_ev);S.tab="dukat";}
else if(t.id>=104){
 // Нови задаци област 13 — обрада на основу tabs низа
 t.tabs.forEach(function(tb){
  if(tb.k==="poj"||tb.k==="syn"||tb.k==="izvod")return;
  var evKey=tb.k+"_ev";
  if(!t[evKey])return;
  if(tb.m==="ziro")d[tb.k]=sZiro(t[evKey]);
  else d[tb.k]=sDob(t[evKey]);
 });
 // Синтетички — ако постоји таб "syn", генеришемо од свих добављача
 var hasSyn=t.tabs.some(function(tb){return tb.k==="syn";});
 if(hasSyn){
  // Списак добављача = сви табови са m:"dob"
  var dobTabs=t.tabs.filter(function(tb){return tb.m==="dob";});
  var arrs=dobTabs.map(function(tb){return d[tb.k];});
  // Кратке ознаке за синт. (од label-а)
  var lbls=dobTabs.map(function(tb){
   var lb=tb.lb;
   var idx=lb.indexOf(") ");
   return idx>=0?lb.substring(idx+2):lb;
  });
  d.syn=sSynDobN(arrs,lbls);
 }
 // Прва картица као почетна
 S.tab=t.tabs[0].k;
}
S.data=d;render();S.skipRead=false;}

function getTaskKeys(t){

if(t.id===1)keys=[{p:"fifo",d:"fifo"},{p:"avg",d:"avg"},{p:"plan",d:"plan"}];
else if(t.id===2)keys=[{p:"stof",d:"stof"},{p:"svila",d:"svila"},{p:"syn",d:"syn",syn:true}];
else if(t.id===3)keys=[{p:"fifo",d:"fifo"}];
else if(t.id===4)keys=[{p:"avg",d:"avg"}];
else if(t.id===5)keys=[{p:"pamuk",d:"pamuk"},{p:"vuna",d:"vuna"},{p:"syn",d:"syn",syn:true}];
else if(t.id===6)keys=[{p:"cigle",d:"cigle"},{p:"crijep",d:"crijep"},{p:"syn",d:"syn",syn:true}];
else if(t.id===7)keys=[{p:"plan",d:"plan"}];
else if(t.id===8)keys=[{p:"avg",d:"avg"}];
else if(t.id===9)keys=[{p:"fifo",d:"fifo"}];
else if(t.id===10)keys=[{p:"drvo",d:"drvo"},{p:"lijepak",d:"lijepak"},{p:"syn",d:"syn",syn:true}];
else if(t.id===101)keys=[{p:"min",d:"min",dob:true},{p:"slob",d:"slob",dob:true}];
else if(t.id===102)keys=[{p:"boja",d:"boja"},{p:"duga",d:"duga",dob:true},{p:"ziro",d:"ziro",dob:true}];
else if(t.id===103)keys=[{p:"dukat",d:"dukat",dob:true}];
else if(t.id>=104){
 // Нови задаци: на основу tabs
 t.tabs.forEach(function(tb){

 });

}

function doCheck(){saveDOM();var nc={},ok=0,tot=0;var mc=["u","iz","s","c","dg","pt","sl"],sc=["dg","pt","sl"];
function ct(p,rows,cols){if(!rows)return;for(var r=0;r<rows.length;r++)for(var c=0;c<cols.length;c++){var cv=rows[r][cols[c]];if(cv==null)continue;tot++;var k=p+"-"+r+"-"+cols[c];var raw=S.inp[k];var uv=pv(raw);var pass=Math.abs(uv-cv)<=Math.abs(cv)*0.02+1;if(pass&&(raw===undefined||raw==="")&&cv===0)pass=false;nc[k]=pass;if(pass)ok++;}}
var keys=getTaskKeys(S.task);
for(var i=0;i<keys.length;i++){var ki=keys[i];ct(ki.p,S.data[ki.d],(ki.syn||ki.dob)?sc:mc);}
// Also check КОНТРОЛА row inputs
var allPfx=keys.map(function(x){return x.p;});
for(var pi=0;pi<allPfx.length;pi++){var pfx=allPfx[pi];var rows=S.data[keys[pi].d];if(!rows)continue;
var cols=keys[pi].syn?sc:mc;
for(var ci=0;ci<cols.length;ci++){var c=cols[ci];if(c==="s"||c==="c")continue;
var realSum=0;for(var ri=0;ri<rows.length;ri++)realSum+=(rows[ri][c]||0);
var kk=pfx+"-sum-"+c;if(S.inp[kk]!==undefined&&S.inp[kk]!==""){tot++;var uv2=pv(S.inp[kk]);var pass2=Math.abs(uv2-realSum)<=Math.abs(realSum)*0.02+1;nc[kk]=pass2;if(pass2)ok++;}}}
// Check mjesecni
var mjd=getMjData(S.task,S.data);
if(mjd){for(var mi=0;mi<mjd.length;mi++){var mr=mjd[mi];var mjcols=["dg","ptr","sl"];
for(var mci=0;mci<mjcols.length;mci++){var mk="mj-"+mi+"-"+mjcols[mci];var mv=mr[mjcols[mci]];
if(S.inp[mk]!==undefined&&S.inp[mk]!==""){tot++;var pass3=Math.abs(pv(S.inp[mk])-mv)<=Math.abs(mv)*0.02+1;nc[mk]=pass3;if(pass3)ok++;}}}}
// Check izvod (било који задатак који има izvodCfg)
if(S.task.izvodCfg&&S.task.izvodCfg.length){
S.task.izvodCfg.forEach(function(c){
 var rr=S.data[c.key];if(!rr)return;
 var sD=0,sP=0;
 for(var k=0;k<rr.length-1;k++){sD+=(rr[k].dg||0);sP+=(rr[k].pt||0);}
 var ans={};ans["izv-"+c.key+"-dg"]=sD;ans["izv-"+c.key+"-pt"]=sP;ans["izv-"+c.key+"-sl"]=sP-sD;
 for(var izK in ans){if(S.inp[izK]!==undefined&&S.inp[izK]!==""){tot++;var iPass=Math.abs(pv(S.inp[izK])-ans[izK])<=Math.abs(ans[izK])*0.02+1;nc[izK]=iPass;if(iPass)ok++;}}
});
}
S.chk=nc;var pct=tot>0?Math.round(ok/tot*100):0;var prev=S.stats[S.task.id]||{att:0,best:0};
S.stats[S.task.id]={att:prev.att+1,best:Math.max(prev.best,pct)};
var wasNew=false;
if(!S.learn&&pct===100&&!S.wallet[S.task.id]){S.wallet[S.task.id]=S.task.km;wasNew=true;}
S.skipRead=true;render();S.skipRead=false;
if(pct===100){setTimeout(function(){showSuccess(wasNew?S.task.km:null,S.learn);},300);}
}

function f(p,rows,cols){if(!rows)return;for(var r=0;r<rows.length;r++)for(var c=0;c<cols.length;c++){var cv=rows[r][cols[c]];if(cv==null)continue;S.inp[p+"-"+r+"-"+cols[c]]=String(cv);S.chk[p+"-"+r+"-"+cols[c]]=true;}

S.inp[p+"-sum-"+c2]=String(sm);S.chk[p+"-sum-"+c2]=true;}}
var keys=getTaskKeys(S.task);

// Fill izvod (било који задатак који има izvodCfg)

 S.inp["izv-"+c.key+"-dg"]=String(sD);S.chk["izv-"+c.key+"-dg"]=true;

 S.inp["izv-"+c.key+"-sl"]=String(sP-sD);S.chk["izv-"+c.key+"-sl"]=true;
});

["\u21a9\ufe0f","\u041f\u043e\u0432\u0440\u0430\u0442\u043d\u0438\u0446\u0430 (\u0421\u0422\u041e\u0420\u041d\u041e)","<p>\u041a\u0430\u0434\u0430 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u045a\u0430 \u0432\u0440\u0430\u0442\u0438 \u043d\u0435\u0443\u0442\u0440\u043e\u0448\u0435\u043d \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b \u0443 \u043c\u0430\u0433\u0430\u0446\u0438\u043d. \u0422\u043e \u0458\u0435 \u0441\u0443\u043f\u0440\u043e\u0442\u043d\u043e \u043e\u0434 \u0442\u0440\u0435\u0431\u043e\u0432\u0430\u045a\u0430 \u2014 \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b \u0441\u0435 \u0432\u0440\u0430\u045b\u0430 \u043d\u0430\u0437\u0430\u0434.</p><p>\u041a\u045a\u0438\u0436\u0438 \u0441\u0435 \u043a\u0430\u043e <b>\u043c\u0438\u043d\u0443\u0441 \u043d\u0430 \u0438\u0437\u043b\u0430\u0437\u0443</b> (\u0441\u043c\u0430\u045a\u0443\u0458\u0435 \u043f\u043e\u0442\u0440\u0430\u0436\u043d\u0443 \u0441\u0442\u0440\u0430\u043d\u0443). \u0421\u0442\u0430\u045a\u0435 \u0441\u0435 \u043f\u043e\u0432\u0435\u045b\u0430\u0432\u0430 \u0458\u0435\u0440 \u0438\u043c\u0430\u043c\u043e \u0432\u0438\u0448\u0435 \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b\u0430. \u0421\u0430\u043b\u0434\u043e \u0441\u0435 \u043f\u043e\u0432\u0435\u045b\u0430\u0432\u0430.</p><div class='formula'>\u041f\u0440\u0438\u043c\u0458\u0435\u0440: \u041f\u043e\u0432\u0440\u0430\u0442\u043d\u0438\u0446\u0430 32 \u2014 50\u043c \u2192 \u0438\u0437\u043b\u0430\u0437 = \u221250, \u043f\u043e\u0442\u0440\u0430\u0436\u0443\u0458\u0435 = \u2212\u0432\u0440\u0438\u0458\u0435\u0434\u043d\u043e\u0441\u0442</div>"],
["\ud83d\udcc8","FIFO \u043c\u0435\u0442\u043e\u0434","<p><b>First In, First Out</b> \u2014 \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b \u043a\u043e\u0458\u0438 \u0458\u0435 \u043f\u0440\u0432\u0438 \u043d\u0430\u0431\u0430\u0432\u0459\u0435\u043d, \u043f\u0440\u0432\u0438 \u0441\u0435 \u0438 \u0438\u0437\u0434\u0430\u0458\u0435. \u0421\u0432\u0430\u043a\u0430 \u043d\u0430\u0431\u0430\u0432\u043a\u0430 \u0447\u0438\u043d\u0438 \u043f\u043e\u0441\u0435\u0431\u043d\u0443 \u043f\u0430\u0440\u0442\u0438\u0458\u0443 \u0441\u0430 \u0441\u0432\u043e\u0458\u043e\u043c \u0446\u0438\u0458\u0435\u043d\u043e\u043c.</p><p>\u041a\u043e\u0434 \u0438\u0437\u0434\u0430\u0432\u0430\u045a\u0430 \u0443\u0432\u0438\u0458\u0435\u043a \u043f\u0440\u0432\u043e \u0442\u0440\u043e\u0448\u0438\u043c\u043e \u043d\u0430\u0458\u0441\u0442\u0430\u0440\u0438\u0458\u0443. \u0410\u043a\u043e \u0458\u0435\u0434\u043d\u0430 \u043f\u0430\u0440\u0442\u0438\u0458\u0430 \u043d\u0438\u0458\u0435 \u0434\u043e\u0432\u043e\u0459\u043d\u0430, \u0440\u0430\u0437\u0431\u0438\u0458\u0430\u043c\u043e \u043d\u0430 \u0434\u0432\u0430 \u0440\u0435\u0434\u0430: \u043f\u0440\u0432\u043e \u0441\u0442\u0430\u0440\u0430 \u0446\u0438\u0458\u0435\u043d\u0430, \u043f\u0430 \u043d\u043e\u0432\u0430.</p><div class='formula'>\u041f\u0440\u0438\u043c\u0458\u0435\u0440: \u0438\u043c\u0430\u043c\u043e 100\u043c\u00d710\u041a\u041c \u0438 50\u043c\u00d711\u041a\u041c. \u0422\u0440\u0435\u0431\u043e\u0432\u0430\u045a\u0435 120\u043c:</div><div class='formula'>1. \u0440\u0435\u0434: 100\u043c \u00d7 10 = 1.000 (\u0441\u0442\u0430\u0440\u0438\u0458\u0430 \u043f\u0430\u0440\u0442\u0438\u0458\u0430)</div><div class='formula'>2. \u0440\u0435\u0434: 20\u043c \u00d7 11 = 220 (\u043d\u043e\u0432\u0438\u0458\u0430 \u043f\u0430\u0440\u0442\u0438\u0458\u0430)</div>"],
["\u2696\ufe0f","\u041f\u0440\u043e\u0441\u0458\u0435\u0447\u043d\u0430 \u0446\u0438\u0458\u0435\u043d\u0430","<p>\u041f\u043e\u0441\u043b\u0438\u0458\u0435 \u0421\u0412\u0410\u041a\u0415 \u043d\u0430\u0431\u0430\u0432\u043a\u0435 \u0440\u0430\u0447\u0443\u043d\u0430\u043c\u043e \u043d\u043e\u0432\u0443 \u043f\u0440\u043e\u0441\u0458\u0435\u0447\u043d\u0443 \u0446\u0438\u0458\u0435\u043d\u0443. \u0418\u0437\u043c\u0435\u0452\u0443 \u0434\u0432\u0438\u0458\u0435 \u043d\u0430\u0431\u0430\u0432\u043a\u0435, \u0446\u0438\u0458\u0435\u043d\u0430 \u043e\u0441\u0442\u0430\u0458\u0435 \u0438\u0441\u0442\u0430 \u0437\u0430 \u0441\u0432\u0430 \u0442\u0440\u0435\u0431\u043e\u0432\u0430\u045a\u0430.</p><div class='formula'>\u041f\u0440\u043e\u0441\u0458\u0435\u0447\u043d\u0430 = \u0421\u0430\u043b\u0434\u043e (\u0443\u043a\u0443\u043f\u043d\u0430 \u0432\u0440\u0438\u0458\u0435\u0434\u043d\u043e\u0441\u0442) \u00f7 \u0421\u0442\u0430\u045a\u0435 (\u0443\u043a\u0443\u043f\u043d\u0430 \u043a\u043e\u043b\u0438\u0447\u0438\u043d\u0430)</div><div class='formula'>\u041f\u0440\u0438\u043c\u0458\u0435\u0440: \u0441\u0430\u043b\u0434\u043e 3.200 \u041a\u041c, \u0441\u0442\u0430\u045a\u0435 300\u043a\u0433 \u2192 3.200 \u00f7 300 = 10,67 \u041a\u041c</div>"],
["\ud83d\udccb","\u041f\u043b\u0430\u043d\u0441\u043a\u0430 \u0446\u0438\u0458\u0435\u043d\u0430","<p>\u0424\u0438\u043a\u0441\u043d\u0430 \u0446\u0438\u0458\u0435\u043d\u0430 \u043e\u0434\u0440\u0435\u0452\u0435\u043d\u0430 \u0443\u043d\u0430\u043f\u0440\u0438\u0458\u0435\u0434 \u043d\u0430 \u043e\u0441\u043d\u043e\u0432\u0443 \u043f\u0440\u043e\u0441\u0458\u0435\u043a\u0430 \u0438\u0437 \u043f\u0440\u0435\u0442\u0445\u043e\u0434\u043d\u0435 \u0433\u043e\u0434\u0438\u043d\u0435. \u0418\u0441\u0442\u0430 \u0437\u0430 \u0441\u0432\u0435 \u0443\u043b\u0430\u0437\u0435 \u0438 \u0438\u0437\u043b\u0430\u0437\u0435 \u0443 \u0446\u0438\u0458\u0435\u043b\u043e\u043c \u043f\u0435\u0440\u0438\u043e\u0434\u0443. \u041d\u0435 \u043c\u0438\u0458\u0435\u045a\u0430 \u0441\u0435.</p><p>\u041a\u043e\u0434 \u0437\u0430\u0434\u0430\u0442\u0430\u043a\u0430 \u0441\u0430 \u0432\u0438\u0448\u0435 \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b\u0430: <b>\u0410\u043d\u0430\u043b\u0438\u0442\u0438\u0447\u043a\u0430</b> = \u043f\u043e\u0441\u0435\u0431\u043d\u0430 \u043a\u0430\u0440\u0442\u0438\u0446\u0430 \u0437\u0430 \u0441\u0432\u0430\u043a\u0438 \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b. <b>\u0421\u0438\u043d\u0442\u0435\u0442\u0438\u0447\u043a\u0430</b> = \u0437\u0431\u0438\u0440 \u0441\u0432\u0438\u0445.</p><div class='formula'>\u0410\u043d\u0430\u043b\u0438\u0442\u0438\u043a\u0430 \u041c\u041e\u0420\u0410 = \u0421\u0438\u043d\u0442\u0435\u0442\u0438\u0447\u043a\u0438 \u043a\u043e\u043d\u0442\u043e</div>"],
["\ud83d\udd0d","\u0418\u043d\u0432\u0435\u043d\u0442\u0443\u0440\u0430","<p>\u041d\u0430 \u043a\u0440\u0430\u0458\u0443 \u043f\u0435\u0440\u0438\u043e\u0434\u0430, \u0431\u0440\u043e\u0458\u0438\u043c\u043e \u0441\u0442\u0432\u0430\u0440\u043d\u0443 \u043a\u043e\u043b\u0438\u0447\u0438\u043d\u0443 \u0438 \u0443\u043f\u043e\u0440\u0435\u0452\u0443\u0458\u0435\u043c\u043e \u0441\u0430 \u043a\u045a\u0438\u0433\u043e\u0432\u043e\u0434\u0441\u0442\u0432\u0435\u043d\u0438\u043c \u0441\u0442\u0430\u045a\u0435\u043c.</p><div class='formula'>\u041c\u0430\u045a\u0430\u043a: \u0441\u0442\u0432\u0430\u0440\u043d\u043e &lt; \u043a\u045a\u0438\u0433. \u2192 \u043a\u045a\u0438\u0436\u0438 \u043d\u0430 \u041f\u041e\u0422\u0420\u0410\u0416\u041d\u0423 (\u043a\u0430\u043e \u0438\u0437\u043b\u0430\u0437)</div><div class='formula'>\u0412\u0438\u0448\u0430\u043a: \u0441\u0442\u0432\u0430\u0440\u043d\u043e &gt; \u043a\u045a\u0438\u0433. \u2192 \u043a\u045a\u0438\u0436\u0438 \u043d\u0430 \u0414\u0423\u0413\u041e\u0412\u041d\u0423 (\u043a\u0430\u043e \u0443\u043b\u0430\u0437)</div>"],
["\u2699\ufe0f","\u0417\u0430\u0442\u0432\u0430\u0440\u0430\u045a\u0435 \u043a\u043e\u043d\u0442\u0430","<p>\u041d\u0430 \u043a\u0440\u0430\u0458\u0443 \u043f\u0435\u0440\u0438\u043e\u0434\u0430, \u043e\u0441\u0442\u0430\u0442\u0430\u043a \u043c\u0430\u0442\u0435\u0440\u0438\u0458\u0430\u043b\u0430 (\u0441\u0430\u043b\u0434\u043e) \u0441\u0435 \u043f\u0440\u0435\u043d\u043e\u0441\u0438 \u043d\u0430 \u043f\u043e\u0442\u0440\u0430\u0436\u043d\u0443 \u0441\u0442\u0440\u0430\u043d\u0443 \u043a\u0430\u043e \u201e\u0441\u0430\u043b\u0434\u043e \u0437\u0430 \u0438\u0437\u0440\u0430\u0432\u043d\u0430\u045a\u0435\u201c. \u0422\u0438\u043c\u0435 \u0441\u0435 \u043a\u043e\u043d\u0442\u043e \u0437\u0430\u0442\u0432\u0430\u0440\u0430:</p><div class='formula'>\u0423\u043a\u0443\u043f\u043d\u043e \u0414\u0443\u0433\u0443\u0458\u0435 = \u0423\u043a\u0443\u043f\u043d\u043e \u041f\u043e\u0442\u0440\u0430\u0436\u0443\u0458\u0435 (\u0414 = \u041f)</div><p><b>\u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430:</b> \u041f\u0440\u0438\u0458\u0435\u043c\u043d\u0438\u0446\u0430 (\u0443\u043b\u0430\u0437 \u2192 \u0434\u0443\u0433\u0443\u0458\u0435), \u0422\u0440\u0435\u0431\u043e\u0432\u0430\u045a\u0435 (\u0438\u0437\u043b\u0430\u0437 \u2192 \u043f\u043e\u0442\u0440\u0430\u0436\u0443\u0458\u0435), \u041f\u043e\u0432\u0440\u0430\u0442\u043d\u0438\u0446\u0430 (\u0441\u0442\u043e\u0440\u043d\u043e \u2192 \u043c\u0438\u043d\u0443\u0441 \u043f\u043e\u0442\u0440\u0430\u0436\u043d\u0435).</p>"]

["🧳","Појам добављача","<p><b>Добављач</b> је предузеће или лице које нам испоручује робу, материјал или услуге, с тим да му се плати у одређеном року. Док му се не исплати уговорена сума, постоји <b>обавеза према добављачу</b>.</p><p>Добављачи су наши <b>повјериоци</b> (ми им дугујемо). Поред њих, повјериоци могу бити и банке (за дате кредите), повјериоци по примљеним кауцијама итд.</p><p>За сваког добављача отвара се <b>посебан конто (картица)</b> са колонама: Дугује, Потражује, Салдо. Скуп свих ових картица назива се <b>картотека добављача</b>.</p><div class='formula'>📈 Нова фактура (испорука) → ПОТРАЖУЈЕ (обавеза расте)<br>📉 Плаћање / попуст → ДУГУЈЕ (обавеза пада)</div><p>На крају обично је износ на потражној већи од износа на дуговној, јер се обично прво испоручи роба, а затим врши плаћање.</p>"],

["📑","Шема конта добављача","<p>Сваки добављач има свој конто са двије стране:</p><div class='formula' style='text-align:center;line-height:1.8'><b style='color:#22c55e'>ДУГУЈЕ</b> (смањење обавезе) <span style='color:#fbbf24'>│ ДОБАВЉАЧ │</span> <b style='color:#ef4444'>ПОТРАЖУЈЕ</b> (повећање обавезе)<br><span style='font-size:9px'>───────────────────────────────────────</span><br><span style='text-align:left;display:inline-block;font-size:10px'>• исплаћене обавезе<br>• враћена роба, амбалажа<br>• мањкови при испоруци<br>• одобрени попусти<br>&nbsp;&nbsp;&nbsp;(сконто, бонификација)<br>• <b>салдо за изравнање</b></span> &nbsp;&nbsp;&nbsp; <span style='text-align:left;display:inline-block;font-size:10px'>• <b>почетно стање</b><br>• сва повећања обавеза<br>• за испоручену робу,<br>&nbsp;&nbsp;материјал или услуге<br>• вишкови при испоруци</span></div><p style='font-size:10px;margin-top:6px'>Тако се на конту добављача увијек види: колико износе обавезе, колико је плаћено, и колика је још неисплаћена обавеза.</p>"],

["📄","Документација","<p>За књижење на контима добављача користе се сљедећи документи:</p><p>① <b>Рачун или фактура</b> — шаље је добављач за купљену робу, материјал или извршене услуге. Назива се <b>куповна (улазна) фактура</b>. → ПОТРАЖУЈЕ.</p><p>② <b>Извод банке о стању на жиро-рачуну</b> — документ који служи као доказ да је извршен пренос новчаних средстава са нашег жиро-рачуна на жиро-рачун добављача (продавца). → ДУГУЈЕ.</p><p>③ <b>Писмо о бонификацији</b> — шаље га добављач купцу када купац рекламира оштећење или слабији квалитет приспјеле робе. Одобрена бонификација <b>смањује обавезу</b> према добављачу. → ДУГУЈЕ.</p><p>④ <b>Комисијски записник о вишку или мањку</b> — саставља се када купац рекламира пријем вишка или мањка приспјеле робе. Вишак <b>повећава</b> обавезу (→ ПОТР), а мањак је <b>смањује</b> (→ ДУГ).</p>"],

["✉️","Примјер: Писмо о бонификацији","<div style='border:2px solid #fbbf24;border-radius:8px;padding:10px;background:rgba(251,191,36,.05);font-size:10px;line-height:1.6;margin:6px 0'><div style='text-align:center;font-weight:700;margin-bottom:8px;color:#fbbf24'>ПИСМО О БОНИФИКАЦИЈИ</div><div style='display:flex;justify-content:space-between;font-size:9px'><div>Предузеће „Воћар“<br>Бања Лука</div><div style='text-align:right'>Бања Лука, 10.06.20..</div></div><div style='text-align:center;margin:8px 0;font-weight:700'>Предузеће „Јабука“ Бијељина</div><div style='font-size:9px'>На ваш захтјев од 05.06.20.. одобравамо вам бонификацију у износу од <b>150,- КМ</b> (стопедесет конвертибилних марака), у вези са испоруком јабука по отпремници бр. 536, с обзиром да су испоручене јабуке слабијег квалитета од уговореног.</div><div style='text-align:right;margin-top:8px;font-size:9px;font-style:italic'>Комерцијала</div></div><p style='font-size:9px;color:#94a3b8'>На основу овог писма, „Јабука“ умањује своју обавезу према „Воћару“ за 150 КМ — књижи на дуговну страну конта добављача „Воћар“.</p>"],

["🏦","Аналитичка и синтетичка евиденција","<p>Пословни односи са добављачима прате се књиговодственом евиденцијом, и то <b>аналитички</b> и <b>синтетички</b>.</p><p><b>Аналитичка евиденција</b> се води у повезаној књизи (књига добављача) или као картотека. За сваког добављача отвара се <b>посебна картица</b>. Збир свих картица назива се <b>картотека добављача</b>. Картице се слажу по азбучном реду назива добављача, по сједишту, дјелатности или територијалној припадности.</p><p><b>Синтетичка евиденција</b> се води на <b>једној картици (конту)</b> на коју се збирно (према свим добављачима скупа) уносе пословне промјене.</p><div class='formula'>⚖ Промет ДУГУЈЕ синтетичког = Σ свих ДУГУЈЕ из аналитике<br>⚖ Промет ПОТР. синтетичког = Σ свих ПОТР. из аналитике</div><p>Ако се промети слажу, онда се мора слагати и салдо.</p>"],

["📊","Извод из аналитичке евиденције","<p><b>Извод</b> је табела помоћу које се повремено провјерава слагање аналитичке и синтетичке евиденције. У извод се уносе подаци за <b>сваког добављача појединачно</b>: промет дугује, промет потражује и салдо.</p><div class='formula' style='text-align:left;font-size:9px;line-height:1.6'>┌─────┬──────────────┬──────────┬──────────┬──────────┐<br>│ Р.б.│ Назив добав. │ Пр. ДУГ. │ Пр. ПОТ. │ Салдо П. │<br>├─────┼──────────────┼──────────┼──────────┼──────────┤<br>│ 1.  │ „МИН“        │ 320.000  │ 825.000  │ 505.000  │<br>│ 2.  │ „Слобода“    │ 410.000  │ 455.000  │  45.000  │<br>├─────┼──────────────┼──────────┼──────────┼──────────┤<br>│     │ <b>УКУПНО</b>      │ <b>730.000</b>  │ <b>1.280.000</b>│ <b>550.000</b>  │<br>└─────┴──────────────┴──────────┴──────────┴──────────┘</div><p>💡 Ако се промети из извода <b>слажу</b> са синтетичким контом, онда се мора слагати и салдо. Ако не — има грешка у књижењу.</p>"],

["💰","Сконто (попуст за рано плаћање)","<div class='formula' style='background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5'>⚠ ВАЖНО: <b>сконто</b> ≠ <b>конто</b>!<br>• <b>Конто</b> = картица за књижење (Дугује/Потражује/Салдо)<br>• <b>Сконто</b> = ПОПУСТ ЗА РАНО ПЛАЋАЊЕ</div><p><b>Сконто</b> је попуст који добављач одобрава купцу ако плати <b>прије рока</b> доспијећа. Обично 1-3% од вриједности фактуре. Циљ добављача је: брже наплатити, иако мало мање.</p><p>Када се одобри сконто, обавеза према добављачу се <b>смањује</b> за два дијела:</p><div class='formula'>① Дозначен износ (умањен за сконто) → ДУГУЈЕ<br>② Износ сконта → ДУГУЈЕ<br>───────────────────────────────<br>Σ = пуна вриједност фактуре (обавеза је измирена)</div><p><b>Примјер:</b> Фактура је 300.000 КМ. Купац плаћа прије рока, добављач одобрава 1% сконта.</p><div class='formula'>Сконто = 300.000 × 1% = <b>3.000 КМ</b><br>Дозначено = 300.000 − 3.000 = <b>297.000 КМ</b><br><br>Књижи се:<br>• 297.000 → ДУГУЈЕ (по изводу банке)<br>• 3.000 → ДУГУЈЕ (на основу изјаве о сконту)</div>"],

["🎁","Бонификација (попуст за квалитет)","<p><b>Бонификација</b> је попуст који добављач одобрава купцу <b>након рекламације</b> — када је испоручена роба слабијег квалитета, оштећена, или не одговара уговореном асортиману.</p><p>Документ: <b>Писмо о бонификацији</b> које шаље добављач (видјети картицу „Примјер: Писмо о бонификацији“ изнад).</p><div class='formula'>Бонификација → ДУГУЈЕ (обавеза се смањује)</div><p><b>Примјер:</b> Купили смо робу за 80.000 КМ (фактура 78). Након пријема, рекламирали смо квалитет. Добављач је одобрио бонификацију од 2.000 КМ.</p><div class='formula'>Књижи се:<br>• 80.000 → ПОТР. (приликом пријема фактуре)<br>• 2.000 → ДУГ. (по писму о бонификацији)<br>• Преостало 78.000 ће се касније платити дозначеним налогом</div><p style='font-size:10px;color:#94a3b8'>📌 Разлика: <b>сконто</b> = за рано плаћање (нема везе са квалитетом), <b>бонификација</b> = за лош квалитет (нема везе с роком плаћања).</p>"],

["🏧","Жиро-рачун предузећа","<p><b>Жиро-рачун</b> је банковни рачун предузећа преко којег се врши готово сав платни промет. Конто жиро-рачуна функционише <b>супротно</b> од конта добављача:</p><div class='formula'>📈 Новац ДОЛАЗИ (продаја, кредит, наплата) → ДУГУЈЕ<br>📉 Новац ОДЛАЗИ (плаћања, трошкови, провизија) → ПОТРАЖУЈЕ</div><p>Зашто супротно? Зато што је жиро-рачун наша <b>имовина</b> (нешто што посједујемо), а добављач је наша <b>обавеза</b> (нешто што дугујемо). Имовина и обавезе имају супротну логику.</p><p><b>Трошкови платног промета</b> = банкарска провизија при свакој трансакцији. Смањује нам жиро-рачун → ПОТРАЖУЈЕ.</p>"],

["✅","Контролна правила","<div class='formula' style='line-height:1.8'>① Прави промет на синтетичком конту = Σ промета на свим аналитичким контима<br>② Збир салда из извода = салдо синтетичког конта<br>③ За сваки конто: Σ Дугује = Σ Потражује (укључујући салдо за изравнање)<br>④ Салдо иде на ону страну на којој ЈЕ МАЊИ збир — да изједначи стране</div><p>Ако нешто од овога не штима, негдје је грешка у књижењу — треба пронаћи и поправити.</p>"]
];}
